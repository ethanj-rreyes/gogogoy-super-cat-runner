<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Super Cat Runner</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        :root {
            --main-white: #ffffff; 
            --neon-pink: #ff0055;
            --neon-gold: #ffaa00;
        }
        body {
            text-align: center;
            background-color: #050510;
            color: var(--main-white);
            font-family: 'Press Start 2P', cursive;
            height: 100vh;
            margin: 0;
            overflow: hidden;
            touch-action: none;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .bg-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; }
        
        #bg-skyline {
            background: linear-gradient(to bottom, #050510 60%, transparent 100%), 
                        repeating-linear-gradient(90deg, transparent 0, transparent 50px, #111 50px, #111 100px);
            height: 400px; top: auto; bottom: 100px; opacity: 0.6; 
            animation: moveBackground 60s linear infinite;
        }

        #bg-streetlights {
            background-image: radial-gradient(circle at 50% 0, rgba(255,255,255,0.2) 0%, transparent 60%), 
                              linear-gradient(to bottom, #333 10%, transparent 10%);
            background-size: 200px 300px; background-position: 0 150px; top: auto; bottom: 0; height: 300px; 
            animation: moveBackground 5s linear infinite;
        }

        @keyframes moveBackground { from { background-position: 0 0; } to { background-position: -1000px 0; } }

        /* --- ANIMATIONS --- */
        .shake { animation: shake 0.5s; animation-iteration-count: 1; }
        @keyframes shake {
            0% { transform: translate(1px, 1px) rotate(0deg); } 10% { transform: translate(-1px, -2px) rotate(-1deg); }
            30% { transform: translate(3px, 2px) rotate(0deg); } 50% { transform: translate(-1px, 2px) rotate(-1deg); }
            70% { transform: translate(3px, 1px) rotate(-1deg); } 100% { transform: translate(1px, -2px) rotate(-1deg); }
        }

        /* --- UI ELEMENTS --- */
        #game-container {
            position: relative; z-index: 10; display: flex; flex-direction: column;
            align-items: center; justify-content: center; width: 95%; max-width: 800px;
        }

        h1 { 
            color: var(--main-white); text-shadow: 0 0 10px white; margin-bottom: 5px; font-size: 20px; line-height: 1.5;
        }

        #objective-bar {
            background: var(--neon-pink); color: white; padding: 5px 10px; font-size: 10px;
            margin-bottom: 10px; border-radius: 4px; box-shadow: 0 0 10px var(--neon-pink);
            text-transform: uppercase; letter-spacing: 1px;
        }

        canvas {
            border: 4px solid var(--main-white); /* WHITE BORDER */
            background-color: rgba(26, 26, 26, 0.8);
            width: 100%; height: auto; 
            image-rendering: pixelated; box-shadow: 0 0 20px white;
        }

        #leaderboard {
            position: absolute; top: 10px; right: 10px; background: rgba(0, 0, 0, 0.9);
            border: 2px solid var(--main-white); padding: 15px; text-align: left; font-size: 10px; z-index: 20;
        }
        #leaderboard h3 { margin: 0 0 10px 0; color: var(--main-white); text-shadow: 0 0 5px white; }
        ol { padding-left: 20px; margin: 0; color: var(--main-white); }
        li { margin-bottom: 8px; }

        #ui { 
            font-size: 10px; margin-top: 10px; color: var(--main-white); text-shadow: 1px 1px black; 
            display: flex; gap: 15px; justify-content: center; flex-wrap: wrap;
            background: rgba(0,0,0,0.7); padding: 8px; border-radius: 5px; border: 1px solid #333; width: 100%;
        }

        .controls-ui { margin-top: 15px; display: flex; gap: 20px; font-size: 8px; color: #aaa; align-items: center; }
        .control-group { display: flex; align-items: center; gap: 8px; }
        .keycap {
            border: 2px solid #555; border-bottom-width: 4px; background: #222;
            padding: 6px 8px; border-radius: 4px; color: white; font-size: 10px; box-shadow: 0 2px 0 #111;
        }
        
        #mobile-controls { display: none; margin-top: 15px; width: 100%; justify-content: center; gap: 15px;}
        .btn { background: #444; border: 2px solid white; color: white; padding: 15px 25px; font-family: 'Press Start 2P'; border-radius: 10px; box-shadow: 0 4px 0 #222; font-size: 12px;}
        .btn:active { transform: translateY(4px); box-shadow: 0 0 0 #222; }

        @media (max-width: 768px) {
            #mobile-controls { display: flex; }
            #leaderboard, .controls-ui { display: none; }
            h1 { font-size: 14px; }
            #objective-bar { font-size: 8px; }
        }
    </style>
</head>
<body>

    <div id="bg-skyline" class="bg-layer"></div>
    <div id="bg-streetlights" class="bg-layer"></div>

    <div id="leaderboard">
        <h3>TOP Scores</h3>
        <ol id="scoreList"><li>---</li><li>---</li><li>---</li></ol>
    </div>

    <div id="game-container">
        <h1>GoGoGoy: Cat Supper Runner!!!</h1>
        <div id="objective-bar">Objective: Get 30+ Fishes to Earn 50 GCash!!!</div>
        
        <canvas id="gameCanvas" width="800" height="200"></canvas>
        
        <div id="ui">
            <span>LIVES: <span id="livesDisplay" style="color:var(--neon-pink)">9</span></span>
            <span>FISH: <span id="scoreDisplay" style="color:var(--neon-gold)">0</span></span>
            <span>HAIRBALL: <span id="cooldownDisplay">READY</span></span>
            <span>SHIELD: <span id="shieldDisplay">0/10</span></span>
        </div>

        <div class="controls-ui">
            <div class="control-group"><div class="keycap">SPACE</div><span>JUMP / RESTART</span></div>
            <div class="control-group"><div class="keycap">F</div><span>FIRE</span></div>
        </div>
        
        <div id="mobile-controls">
            <button class="btn" id="jumpBtn">JUMP</button>
            <button class="btn" id="shootBtn">SHOOT</button>
        </div>
    </div>

    <script src="script.js"></script> 
</body>
</html>
